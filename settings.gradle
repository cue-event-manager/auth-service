pluginManagement {
    repositories {
        //mavenLocal()
        //maven { url = '...' }
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'cue-event-manager'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':jpa-repository'
project(':jpa-repository').projectDir = file('./infrastructure/driven-adapters/jpa-repository')
include ':seeder'
project(':seeder').projectDir = file('./infrastructure/entry-points/seeder')
include ':api-rest'
project(':api-rest').projectDir = file('./infrastructure/entry-points/api-rest')
include ':password-encoder'
project(':password-encoder').projectDir = file('./infrastructure/driven-adapters/password-encoder')
include ':jwt-token-provider'
project(':jwt-token-provider').projectDir = file('./infrastructure/driven-adapters/jwt-token-provider')
include ':spring-security-context'
project(':spring-security-context').projectDir = file('./infrastructure/driven-adapters/spring-security-context')
include ':sns'
project(':sns').projectDir = file('./infrastructure/driven-adapters/sns')