server:
  port: 8081

spring:
  application:
    name: "cue-event-manager-auth-service"

  devtools:
    add-properties: false

  profiles:
    include: null

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    databasePlatform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
  driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:5173,http://localhost:8080"

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000
  internal:
    secret: ${INTERNAL_SECRET:123}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    preferIpAddress: true